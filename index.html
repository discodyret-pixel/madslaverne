<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1b1a2b">
<meta name="description" content="Pixel-arkadespil om de blå british shorthairs Mr Fluffy og Nova og deres madslaver Kristian og Jakob.">
<style>
/* Base reset (the claude.ai viewer adds this automatically; needed when hosted elsewhere) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Madslaverne</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one centred arcade column: toolbar, 16:9 game stage, touch pad, key legend. Single dark "flat at 5 a.m." look. */
:root{
  --night:#1b1a2b;      /* page ground: the flat before sunrise */
  --panel:#27253b;
  --line:#403c5c;
  --cream:#f3ead8;
  --muted:#aaa3bd;
  --copper:#e8932c;     /* the cats' eyes */
  --copper-deep:#a8601a;
  --fur:#8e98ad;        /* british blue */
  --display:"Pixelify Sans","Silkscreen",ui-monospace,monospace;
  --util:"Silkscreen","Pixelify Sans",ui-monospace,monospace;
  --chrome:150px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--display);-webkit-tap-highlight-color:transparent}
#app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#frame{width:min(100%,1000px,calc((100vh - var(--chrome)) * 1.7778));width:min(100%,1000px,calc((100svh - var(--chrome)) * 1.7778));
  min-width:min(100%,300px);display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.brand{font-family:var(--util);font-size:13px;letter-spacing:.08em;color:var(--muted)}
.brand b{color:var(--copper);font-weight:400}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{font-family:var(--util);font-size:12px;letter-spacing:.04em;background:var(--panel);color:var(--cream);border:2px solid var(--line);padding:5px 10px;cursor:pointer}
.tool:hover{border-color:var(--copper)}
#stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;container-type:inline-size;background:#000;
  box-shadow:0 0 0 3px var(--line),0 12px 0 -2px #121120;overflow:hidden}
#game{display:block;width:100%;height:100%;touch-action:none}
#overlay{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:max(8px,2cqw);
  padding:max(10px,3cqw) max(12px,4cqw);background:rgba(24,22,38,.80);overflow-y:auto;text-align:center;box-sizing:border-box}
.screen.light{background:linear-gradient(90deg,rgba(24,22,38,.92) 0%,rgba(24,22,38,.86) 55%,rgba(24,22,38,.35) 100%);align-items:flex-start;text-align:left}
.eyebrow{font-family:var(--util);font-size:max(10px,1.7cqw);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1{margin:0;font-size:max(30px,10cqw);line-height:.95;font-weight:700;color:var(--copper);text-shadow:.6cqw .6cqw 0 #0e0d18;text-wrap:balance}
h2{margin:0;font-size:max(18px,4.6cqw);line-height:1.05;font-weight:700;color:var(--cream);text-wrap:balance}
p{margin:0;font-size:max(11px,2cqw);line-height:1.35;max-width:62ch}
.lede{color:var(--cream)}
.dim{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:max(8px,1.6cqw);justify-content:center}
.screen.light .row{justify-content:flex-start}
.btn{font-family:var(--display);font-weight:600;font-size:max(13px,2.3cqw);padding:.45em 1.2em;background:var(--copper);color:#1b1a2b;border:0;
  box-shadow:0 .25em 0 var(--copper-deep);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(.18em);box-shadow:0 .07em 0 var(--copper-deep)}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--copper)}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.cats{display:flex;gap:max(8px,2.4cqw);justify-content:center;width:100%}
.catcard{flex:1 1 0;min-width:0;max-width:300px;background:var(--panel);border:2px solid var(--line);color:var(--cream);padding:max(6px,1.4cqw);
  display:flex;flex-direction:column;gap:max(4px,.8cqw);text-align:left;cursor:pointer;font-family:var(--display)}
.catcard:hover,.catcard.sel{border-color:var(--copper)}
.catcard canvas{width:100%;aspect-ratio:2/1;image-rendering:pixelated;background:#34314f;display:block}
.catcard .nm{font-size:max(14px,2.8cqw);font-weight:700}
.catcard .ds{font-size:max(10px,1.6cqw);color:var(--muted);line-height:1.3}
.stat{display:grid;grid-template-columns:5.5em 1fr;align-items:center;font-family:var(--util);font-size:max(9px,1.3cqw);color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{display:block;width:max(6px,1.2cqw);height:max(6px,1.2cqw);background:#3b3858}
.pips i.on{background:var(--copper)}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:max(6px,1.3cqw);width:100%;max-width:88cqw}
.lvl{background:var(--panel);border:2px solid var(--line);color:var(--cream);font-family:var(--display);text-align:left;padding:max(5px,1.1cqw);
  display:flex;flex-direction:column;gap:max(2px,.5cqw);cursor:pointer;min-width:0}
.lvl:hover:not([disabled]){border-color:var(--copper)}
.lvl[disabled]{cursor:default;opacity:.55}
.lvl .num{font-family:var(--util);font-size:max(9px,1.3cqw);color:var(--copper)}
.lvl .nm{font-size:max(11px,1.8cqw);font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.lvl .st{font-size:max(11px,1.8cqw);letter-spacing:.1em;color:var(--copper)}
.lvl .st .off{color:#4a4668}
.lvl .soon{font-family:var(--util);font-size:max(8px,1.1cqw);color:var(--muted)}
.brief{display:flex;flex-direction:column;gap:max(6px,1.3cqw);max-width:58%}
.brief dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:max(3px,.7cqw) max(8px,1.4cqw);font-size:max(11px,1.9cqw);line-height:1.3}
.brief dt{font-family:var(--util);font-size:max(9px,1.3cqw);color:var(--copper);letter-spacing:.06em;padding-top:.25em}
.brief dd{margin:0}
.stars{font-size:max(26px,6cqw);letter-spacing:.12em;color:var(--copper);line-height:1}
.stars .off{color:#4a4668}
.keys{font-family:var(--util);font-size:11px;color:var(--muted);text-align:center;margin:0;max-width:none}
.keys kbd{font-family:var(--util);color:var(--cream);background:var(--panel);border:1px solid var(--line);padding:0 4px}
#pad{display:none;justify-content:space-between;align-items:flex-end;gap:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.grp{display:grid;gap:8px}
.grp.dir{grid-template-columns:repeat(3,58px)}
.grp.act{grid-template-columns:repeat(2,auto)}
.pad-btn{height:58px;min-width:58px;font-family:var(--util);font-size:13px;background:var(--panel);color:var(--cream);border:2px solid var(--line);
  border-radius:14px;touch-action:none}
.pad-btn.big{min-width:96px;background:var(--copper);color:#1b1a2b;border-color:var(--copper-deep)}
.pad-btn.on{transform:translateY(2px);filter:brightness(.85)}
body.touch #pad{display:flex}
body.touch .keys{display:none}
body.touch{--chrome:200px}
@media (orientation:landscape) and (max-height:540px){
  body.touch{--chrome:92px}
  body.touch #pad{position:fixed;left:0;right:0;bottom:0;pointer-events:none;
    padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  body.touch .grp{pointer-events:auto}
  .grp.dir{grid-template-columns:repeat(2,52px)}
  .grp.dir .down{grid-column:1 / span 2}
  .grp.act{grid-template-columns:auto}
  .pad-btn{height:52px;min-width:52px;opacity:.9}
  .pad-btn.big{min-width:84px}
}
@media (max-width:520px){
  .brief{max-width:100%}
  .screen.light{background:rgba(24,22,38,.88)}
  .levels{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:460px){.brand .sub{display:none}.tool{font-size:11px;padding:4px 7px}}
.screen{justify-content:safe center}
.btn.mini{font-size:inherit;padding:.15em .6em;box-shadow:inset 0 0 0 2px var(--line)}
.levels+.eyebrow{margin-top:max(4px,1cqw)}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<div id="app">
  <div id="frame">
    <div class="bar">
      <span class="brand"><b>MADSLAVERNE</b><span class="sub"> · Mr Fluffy &amp; Nova</span></span>
      <div class="tools">
        <button class="tool" id="btnHome" type="button">Hjem</button>
        <button class="tool" id="btnSound" type="button">Lyd: til</button>
        <button class="tool" id="btnPause" type="button">Pause</button>
      </div>
    </div>
    <div id="stage">
      <canvas id="game" aria-label="Spillet Madslaverne"></canvas>
      <div id="overlay"></div>
    </div>
    <div id="pad" aria-label="Touch-knapper">
      <div class="grp dir">
        <button class="pad-btn" data-pad="left" type="button" aria-label="Løb til venstre">◀</button>
        <button class="pad-btn down" data-pad="down" type="button" aria-label="Hop ned">▼</button>
        <button class="pad-btn" data-pad="right" type="button" aria-label="Løb til højre">▶</button>
      </div>
      <div class="grp act">
        <button class="pad-btn big" data-pad="action" type="button">BALLADE!</button>
        <button class="pad-btn" data-pad="jump" type="button">HOP</button>
      </div>
    </div>
    <p class="keys" id="keys"><kbd>←</kbd> <kbd>→</kbd> løb · <kbd>Mellemrum</kbd> hop · <kbd>X</kbd> ballade · <kbd>↓</kbd> hop ned · <kbd>P</kbd> pause</p>
  </div>
</div>

<script>
(() => {
'use strict';
const W=320,H=180,S=4,FLOOR=160,GRAV=720;
const FONT='"Pixelify Sans","Silkscreen",monospace';
const OL='#1f1d2b';
const CREAM='#f3ead8', COPPER='#e8932c';

const CATS={
  fluffy:{name:'Mr Fluffy',speed:84,jump:266,power:1,bodyW:13,bodyH:7,chubby:false,col:'#8e98ad',dark:'#6c768c',light:'#b2bacb',push:'slide',
    blurb:'Adræt og hurtig. Hopper højt og når de høje hylder.',stats:{Fart:5,Hop:5,Kraft:2}},
  nova:{name:'Nova',speed:60,jump:220,power:1.35,bodyW:16,bodyH:8,chubby:true,col:'#848ea4',dark:'#646e85',light:'#a8b0c2',push:'shove',
    blurb:'Tung og stærk. Vælter alt i ét skub og irriterer mere.',stats:{Fart:3,Hop:3,Kraft:5}}
};
// Kristian: 180 cm, short grey-flecked hair, red beard round the mouth, grey polo, jeans, orange watch band, big friendly eyes.
// Jakob: 200 cm, dark short hair styled up 1920s-style, clear rectangular glasses with light frames, smiling, all black.
const LOOK={
  kristian:{hair:'#8f8b86',hair2:'#6b6762',shirt:'#8c9099',collar:'#aeb2ba',pants:'#3d5a85',pants2:'#2f4769',shoe:'#2a2a30',skin:'#e7b48f',
    beard:'#b5532e',watch:'#e07a2c',bigEyes:true,tall:0},
  jakob:{hair:'#2a221e',hair2:'#2a221e',shirt:'#3a3a44',collar:'#3a3a44',pants:'#2c2c34',pants2:'#202027',shoe:'#151519',skin:'#eab995',
    glasses:'#dfe4ea',quiff:true,smile:true,tall:5}
};
function face(L,P,fx,fy){ // fx,fy = top-left of an 8x9 head facing right
  P.push([fx,fy+1,8,8,L.skin],[fx,fy,8,3,L.hair],[fx,fy+1,2,(L.quiff?4:6),L.hair],[fx+8,fy+5,1,2,L.skin]);
  if(L.quiff)P.push([fx+3,fy-2,5,2,L.hair],[fx+6,fy-3,2,1,L.hair]);
  if(L.hair2!==L.hair)P.push([fx+2,fy,1,1,L.hair2,1],[fx+5,fy+1,1,1,L.hair2,1],[fx,fy+3,1,1,L.hair2,1]);
  if(L.beard)P.push([fx+4,fy+6,5,3,L.beard,1],[fx+5,fy+8,3,1,L.beard,1],[fx+6,fy+7,2,1,'#7a2f3a',1]);
  if(L.bigEyes)P.push([fx+4,fy+3,2,2,'#fffaf0',1],[fx+5,fy+3,1,2,'#222',1]);
  else P.push([fx+5,fy+4,1,1,'#222',1]);
  if(L.glasses)P.push([fx+3,fy+3,5,1,L.glasses,1],[fx+3,fy+5,5,1,L.glasses,1],[fx+3,fy+3,1,3,L.glasses,1],[fx+7,fy+3,1,3,L.glasses,1],[fx,fy+4,3,1,L.glasses,1]);
  if(L.smile)P.push([fx+5,fy+7,3,1,'#7a2f3a',1],[fx+4,fy+6,1,1,'#7a2f3a',1]);
}
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- save ---------- */
const SAVE_KEY='madslaverne.v1';
let save={stars:{},unlocked:1,mute:false,cat:'fluffy'};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object')save=Object.assign(save,s);}catch(e){}
for(const k in save.stars)if(save.stars[k])save.unlocked=Math.max(save.unlocked,Math.min(17,+k+1));
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- audio ---------- */
let AC=null;
function audio(){
  if(save.mute)return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==='suspended')AC.resume().catch(()=>{});
  return AC;
}
function tone({f=440,f2=null,dur=.15,type='square',vol=.08,delay=0}={}){
  const a=audio();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.03);
}
function noise({dur=.25,vol=.12,delay=0,lp=3000}={}){
  const a=audio();if(!a)return;const t=a.currentTime+delay;const n=Math.floor(a.sampleRate*dur);
  const b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;
  const g=a.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(a.destination);s.start(t);
}
const SFX={
  meow(p=1){tone({f:520*p,f2:860*p,dur:.12,type:'triangle',vol:.1});tone({f:860*p,f2:430*p,dur:.24,type:'triangle',vol:.1,delay:.11});},
  jump(){tone({f:300,f2:620,dur:.09,vol:.04});},
  land(){tone({f:150,f2:80,dur:.08,vol:.06,type:'triangle'});},
  crash(){noise({dur:.35,vol:.2,lp:5200});tone({f:1500,f2:900,dur:.12,vol:.04,delay:.02});},
  puke(){[0,.32,.64].forEach(d=>noise({dur:.14,vol:.1,lp:700,delay:d}));},
  splat(){noise({dur:.22,vol:.16,lp:900});tone({f:300,f2:60,dur:.25,type:'sawtooth',vol:.05});},
  ring(){for(let i=0;i<10;i++)tone({f:1900,dur:.05,vol:.035,delay:i*.07});},
  grab(){tone({f:520,f2:240,dur:.2,vol:.06});},
  knead(){tone({f:230,f2:180,dur:.06,vol:.04,type:'triangle'});},
  paw(){tone({f:700,f2:500,dur:.05,vol:.03,type:'triangle'});},
  tick(){tone({f:950,dur:.04,vol:.035});},
  zoom(){tone({f:200,f2:900,dur:.25,vol:.05,type:'sawtooth'});noise({dur:.2,vol:.06,lp:1500});},
  type(){tone({f:1200+Math.random()*400,dur:.02,vol:.02});},
  win(){[523,659,784,1046].forEach((f,i)=>tone({f,dur:.2,vol:.07,delay:i*.12}));},
  lose(){[392,330,262].forEach((f,i)=>tone({f,dur:.28,vol:.07,delay:i*.18,type:'triangle'}));}
};

/* ---------- menu music: original chiptune, A major, 170 bpm ---------- */
// 8 bars of eighth notes. Melody in MIDI numbers, 0 = rest. Chords give the "oom-pah" left hand.
const MUSIC_MEL=[
  69,73,76,81, 0,80,78,76,   74,78,81,78,74, 0,73,71,
  71,76,80,83, 0,81,80,78,   76, 0,73, 0,69, 0, 0, 0,
  78,76,73,76,78,81,78, 0,   74, 0,74,78,81, 0,78,74,
  76,80,83,80,76,75,76,80,   81, 0,69, 0,81, 0, 0, 0
];
const MUSIC_CH=[[45,61,64],[50,54,57],[40,56,59],[45,61,64],[42,57,61],[50,54,57],[40,56,59],[45,61,64]];
const mus={on:false,timer:null,next:0,step:0,gain:null};
let musicWanted=false;
const mhz=m=>440*Math.pow(2,(m-69)/12);
function mnote(m,t,dur,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(mhz(m),t);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(mus.gain);o.start(t);o.stop(t+dur+.02);
}
function musicTick(){
  const e=60/170/2;
  while(mus.next<AC.currentTime+.25){
    const s=mus.step,t=mus.next,m=MUSIC_MEL[s],ch=MUSIC_CH[Math.floor(s/8)];
    if(m){const held=MUSIC_MEL[(s+1)%64]===0;mnote(m,t,held?e*1.8:e*.85,'square',.045);}
    if(s%2===0)mnote(ch[0],t,e*.9,'triangle',.11);
    else{mnote(ch[1],t,e*.5,'square',.018);mnote(ch[2],t,e*.5,'square',.018);}
    mus.next+=e;mus.step=(s+1)%64;
  }
}
function musicStart(){
  if(mus.on||save.mute||!musicWanted||!AC||AC.state!=='running')return;
  mus.on=true;mus.gain=AC.createGain();mus.gain.gain.value=.9;mus.gain.connect(AC.destination);
  mus.next=AC.currentTime+.06;mus.step=0;musicTick();mus.timer=setInterval(musicTick,40);
}
function musicStop(){
  if(!mus.on)return;mus.on=false;clearInterval(mus.timer);
  const g=mus.gain;g.gain.setTargetAtTime(0,AC.currentTime,.04);setTimeout(()=>{try{g.disconnect();}catch(_){}} ,500);
}
function musicKick(){
  if(!musicWanted||mus.on||save.mute)return;
  const a=audio();if(!a)return;
  (a.state==='running'?Promise.resolve():a.resume()).then(musicStart).catch(()=>{});
}
function musicWant(w){musicWanted=w;if(w)musicKick();else musicStop();}
addEventListener('pointerdown',musicKick,true);
addEventListener('keydown',musicKick,true);

/* ---------- canvas + drawing helpers ---------- */
const cv=document.getElementById('game');cv.width=W*S;cv.height=H*S;
const ctx=cv.getContext('2d');
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
// list of [x,y,w,h,color,noOutline]; drawn mirrored when dir<0, around local x=cx
function parts(g,list,ox,oy,dir,cx=0,ol=OL){
  const tr=r=>{let x=r[0]-cx;if(dir<0)x=-(x+r[2]);return[ox+x,oy+r[1],r[2],r[3]];};
  for(const r of list){if(r[5])continue;const[x,y,w,h]=tr(r);R(g,x-1,y-1,w+2,h+2,ol);}
  for(const r of list){const[x,y,w,h]=tr(r);R(g,x,y,w,h,r[4]);}
}
function txt(g,s,x,y,{size=6,col=CREAM,align='center',outline=OL,alpha=1,weight=600}={}){
  g.save();g.globalAlpha=alpha;g.font=`${weight} ${size}px ${FONT}`;g.textAlign=align;g.textBaseline='middle';

    const free=this.stun<=0&&this.busy<=0;let ax=0;
    if(free){if(inp.left)ax-=1;if(inp.right)ax+=1;}
    if(this.lie&&(ax||inp.jump||inp.down||!this.onGround))this.lie=false;
    if(ax)this.dir=ax;
    if(free&&inp.jump&&this.onGround){this.vy=-this.k.jump;this.onGround=false;this.ground=null;if(inp.sfx)SFX.jump();}
    if(free&&inp.down&&this.onGround&&this.ground){this.drop=.25;this.onGround=false;this.ground=null;}
    if(this.kvx){const s=Math.sign(this.kvx);this.kvx-=s*260*dt;if(Math.sign(this.kvx)!==s)this.kvx=0;}

function mkItem(kind,x,surf,val,o={}){return Object.assign({kind,x,y:surf.y,surf,val,state:'rest',vy:0,vx:0,slide:0,sdir:1,wob:0,from:null},o);}
function pushNearest(cat,items){
  let best=null,bd=1e9;
  for(const it of items){
    if(it.state!=='rest'||it.slide>0)continue;
    if(!cat.onGround||Math.abs(cat.y-it.surf.y)>1)continue;
    const dx=it.x-cat.x;if(Math.abs(dx)>18||dx*cat.dir<-7)continue;
    if(Math.abs(dx)<bd){bd=Math.abs(dx);best=it;}
  }
  if(!best)return null;
  best.sdir=cat.dir;best.wob=.3;
  best.slide=cat.k.push==='shove'?999:(best.heavy?5:10);
  cat.busy=.22;cat.busyPose='paw';SFX.paw();
  return best;
}
function updateItems(items,surfs,dt,onLand){
  for(const it of items){
    it.wob=Math.max(0,it.wob-dt);
    if(it.state==='rest'&&it.slide>0){
      const sp=it.slide>100?150:70,m=Math.min(it.slide,sp*dt);it.slide-=m;it.x+=it.sdir*m;
      if(it.x<it.surf.x0||it.x>it.surf.x1){it.state='fall';it.from=it.surf;it.vx=it.sdir*45;it.vy=-30;it.slide=0;}
    }else if(it.state==='fall'){
      it.vy+=GRAV*dt;it.x+=it.vx*dt;const ny=it.y+it.vy*dt;let hit=null;
      for(const s of surfs){if(s===it.from)continue;if(it.x>=s.x0&&it.x<=s.x1&&it.y<=s.y&&ny>=s.y&&(!hit||s.y<hit.y))hit=s;}
      if(hit){it.y=hit.y;it.vx=0;it.vy=0;it.state='landed';onLand(it,hit);}
      else if(ny>=FLOOR){it.y=FLOOR;it.vx=0;it.vy=0;it.state='landed';onLand(it,null);}
      else it.y=ny;
    }
  }
}

const game={ownerKind:save.owner||null,mode:'title',catKind:CATS[save.cat]?save.cat:'fluffy',li:0,level:null,cat:null,irr:0,time:0,t:0,texts:[],fx:[],shake:0,ending:null,introT:0,lastTick:99};
const power=()=>CATS[game.catKind].power;

function addIrr(v){game.irr=Math.min(100,game.irr+v*power());}
function ftext(x,y,s,col=CREAM,size=6){game.texts.push({x,y,s,col,size,t:1.2});}
function burst(x,y,cols,n=10,sp=60){for(let i=0;i<n;i++)game.fx.push({x,y,vx:(Math.random()*2-1)*sp,vy:-Math.random()*sp-20,t:.5+Math.random()*.4,c:cols[i%cols.length]});}
function shake(a=3){game.shake=Math.max(game.shake,a);}
function grab(o,cat,x,line,done){o.carry={x,done};cat.carried=o;cat.busy=0;cat.kvx=0;cat.lie=false;o.say(line,2.2);SFX.grab();}

function makeL1(night=false){
  const bed={x:118,y:130,w:136},ns={x:262,y:124,w:30},dresser={x:20,y:117,w:46},basket={x:92,y:146,w:18},shelfP={x:149,y:93,w:52};
  const nsS={x0:262,x1:292,y:124},bedS={x0:118,x1:254,y:130,bed:true},dresserS={x0:20,x1:66,y:117},shelfS={x0:149,x1:201,y:93};
  const K={name:'Kristian',look:LOOK.kristian,hx:233,hy:127,wake:0,awake:false,shove:0,bubble:null,zz:0};
  const J={name:'Jakob',look:LOOK.jakob,hx:246,hy:124,wake:0,awake:false,shove:0,bubble:null,zz:.7};
  const SL=[K,J];
  const items=[mkItem('glas',269,nsS,16),mkItem('ur',283,nsS,24)];
  if(night)items.push(mkItem('kop',42,dresserS,14),mkItem('plante',60,dresserS,18,{heavy:true}),mkItem('vase',176,shelfS,22,{heavy:true}));
  let bounce=0,idle=0,side=null;
  const sleepy=night?['Klokken er TRE…','Hvad er det for en LYD?!','Zzz… stop med at løbe…','Hvorfor er du sådan?…']:['Mmh… fem minutter mere…','Nej… sov nu…','Zzz… gå væk…','Ikke nu, mis…','Det er weekend…'];
  function wake(s,v){
    if(s.awake)return;s.wake=Math.min(100,s.wake+v*power());idle=0;
    if(s.wake>=100){s.awake=true;say(s,night?(s===K?'Okay, okay… snacks!':'Vi går ud i stuen…'):(s===K?'Ja ja, JEG ER VÅGEN!':'Okay! Vi står op!'),2.6);burst(s.hx,s.hy-20,[COPPER,CREAM],8,40);}
  }
  const wakeAll=v=>SL.forEach(s=>wake(s,v));
  function shoveOff(s,cat){
    cat.knock(-250,-150,.9);say(s,pick(sleepy),2.2);s.wake=Math.max(0,s.wake-8);SL.forEach(x=>x.shove=0);SFX.grab();
  }
  function lap(cat){wakeAll(10);ftext(cat.x,cat.y-20,'ZOOOM!',COPPER,8);shake(2);SFX.zoom();}
  const lv={plats:night?[bed,ns,dresser,basket,shelfP]:[bed,ns,dresser,basket],owners:[],speakers:SL,spawnX:44,bg:makeBg(g=>bgBedroom(g,night)),catSpeed:night?1.45:1,tint:night?'rgba(8,10,40,.30)':null};
  lv.irritation=()=>(K.wake+J.wake)/2;
  lv.onMeow=()=>wakeAll(1.2);
  lv.update=(dt,cat)=>{
    idle+=dt;if(night&&cat.pose==='walk')idle=Math.min(idle,.5);bounce=Math.max(0,bounce-dt*5);
    for(const s of SL){if(s.awake)continue;s.wake=Math.max(0,s.wake-(night?(idle>1.5?3.4:1.5):(idle>1.5?3:1.1))*dt);s.zz+=dt;if(s.zz>1.5){s.zz=0;ftext(s.hx+5,s.hy-10,'z','#c9c3e8',5);}}
    if(cat.landed&&cat.landed.p===bed&&cat.landed.impact>170){wakeAll(4);bounce=1;ftext(cat.x,cat.y-18,'BUMP!');}
    if(cat.onGround&&cat.ground===bed){
      const inHead=cat.x>=222;
      for(const s of SL){if(s.awake||s.wake<20)continue;const near=inHead&&Math.abs(cat.x-s.hx)<12;s.shove+=dt*(near?1:.4);if(s.shove>2.8){shoveOff(s,cat);break;}}
    }else SL.forEach(s=>s.shove=Math.max(0,s.shove-dt));
    if(night){if(cat.x<26){if(side==='R')lap(cat);side='L';}else if(cat.x>294){if(side==='L')lap(cat);side='R';}}
    updateItems(items,[nsS,bedS,dresserS,shelfS],dt,(it,surf)=>{
      if(it.kind==='ur'){it.state='down';ftext(it.x,it.y-14,'RIIIING!','#ff8a6a',7);SFX.ring();shake(2);wakeAll(it.val);return;}
      if(surf&&surf.bed){it.state='gone';ftext(it.x,it.y-12,'VAND I SENGEN!','#9fd3ea');burst(it.x,it.y,['#6fb3d6','#cfeaf4'],12);SFX.splat();wakeAll(it.val+6);return;}
      it.state='broken';ftext(it.x,it.y-14,'KLIRR!','#cfeaf4',7);burst(it.x,it.y-2,['#cfeaf4','#6fb3d6'],12);SFX.crash();shake(2);wakeAll(it.val);
    });
  };
  lv.action=cat=>{
    if(cat.onGround&&(cat.ground===ns||cat.ground===dresser||cat.ground===shelfP)){if(pushNearest(cat,items))return true;}
    if(cat.onGround&&cat.ground===bed){
      if(cat.cool>0)return true;
      if(cat.x>=222){
        const tg=SL.filter(s=>!s.awake).sort((a,b)=>Math.abs(a.hx-cat.x)-Math.abs(b.hx-cat.x))[0];if(!tg)return false;
        cat.cool=.4;cat.busy=.25;cat.busyPose='meow';wake(tg,11);SL.forEach(s=>{if(s!==tg)wake(s,2);});
        SFX.meow(cat.kind==='nova'?.9:1.2);ftext(cat.x+cat.dir*6,cat.y-20,`MJAV, ${tg.name}!`);return true;
      }
      cat.cool=.33;cat.busy=.3;cat.busyPose='knead';wakeAll(3.4);SFX.knead();ftext(cat.x,cat.y-14,'trip trap','#e9d9b8',5);return true;
    }
    return false;
  };
  lv.onWin=()=>{};
  function drawSleeper(g,s,b){
    const L=s.look;
    if(s.awake){const P=[[-5,-17,9,18,L.shirt]];face(L,P,-4,-26);parts(g,P,s.hx,s.hy+b+3,-1,0);}

      if(L.glasses)P.push([-3,-5,4,1,L.glasses,1],[-3,-3,4,1,L.glasses,1]);

    R(g,113,121,7,39,OL);R(g,114,122,5,38,'#5a3c28');
    R(g,118,138,136,10,'#6b4a33');R(g,120,148,4,12,'#5a3c28');R(g,248,148,4,12,'#5a3c28');
    R(g,118,131+b,136,8,'#e9e4da');
    R(g,221,120+b,33,9,OL);R(g,222,121+b,31,7,'#f4f1ea');
    drawSleeper(g,J,b);drawSleeper(g,K,b);
    R(g,117,125+b,110,14,OL);R(g,118,126+b,108,12,'#d39b4a');R(g,136,123+b,80,3,OL);R(g,137,124+b,78,2,'#d39b4a');
    R(g,224,128+b,30,10,'#d39b4a');R(g,224,127+b,30,1,OL);
    for(let x=122;x<252;x+=9)R(g,x,131+b+((x/9)%2?2:0),2,2,'#e7b86a');
    items.forEach(it=>drawItem(g,it));

  lv.drawFront=()=>{};
  lv.hud=g=>{SL.forEach((s,i)=>{const y=19+i*7;txt(g,s.name,6,y+2,{size:5,align:'left'});R(g,34,y,42,5,OL);R(g,35,y+1,Math.round(40*s.wake/100),3,s.awake?'#7fd48a':COPPER);});};

  const SOFA_X=55,KITCHEN_X=298,RUG=[108,202];

  const puddles=[];let hair=0,puking=null,cleanP=null,resume='toSofa',chaseT=0;
  const lv={plats:[sofa,arm,shelf],owners:[o],speakers:[o],spawnX:160,bg:makeBg(bgLiving)};
  const looking=()=>['toKitchen','toSofa','kitchen','clean','wait'].includes(o.mode)&&!o.carry;
  const sees=cat=>{if(!looking())return false;const dx=cat.x-o.x;return dx*o.dir>0&&Math.abs(dx)<120;};
  const standUp=()=>{o.y=FLOOR;o.pose='stand';o.hold=null;};
  const sitDown=()=>{o.y=sofa.y;o.x=SOFA_X;o.pose='sit';o.hold='phone';o.dir=1;o.mode='sit';o.timer=2.8+Math.random()*1.6;};
  function stepOn(){
    for(const p of puddles){
      if(p.sofa||p.hit)continue;
      if(Math.abs(o.x-p.x)<3){
        p.hit=true;cleanP=p;resume=o.mode;o.mode='slip';o.timer=1.4;o.pose='fallen';o.moving=false;
        addIrr(p.rug?36:24);
        o.say(p.rug?'PÅ TÆPPET?! Igen?!':pick(['ADR! Hvad er det her?!','Næææh, det er vådt!',`${catName().toUpperCase()}!!`]),2.4);

      }
    }
    return false;
  }
  lv.update=(dt,cat)=>{
    hair=Math.max(0,hair-dt);
    if(puking){
      puking.t-=dt;
      if(sees(cat)){
        puking=null;cat.busy=0;o.say('NEJ! Ikke på gulvet!',2);o.mode='chase';chaseT=0;o.pose='alert';o.timer=.35;

/* 12: Ormekuren */
function makeO4(){
  const plats=[{x:100,y:144,w:22},{x:127,y:132,w:106},{x:288,y:129,w:30}];
  const p=mkPlayer(200),order=['fluffy','nova'];
  let ci=0,cat=new Cat('fluffy',30),sus=35,pills=4,snacks=14,cd=0,eat=0,pending=null,leave=0;
  const lv={owner:true,plats:[],owners:[p],speakers:[p],bg:makeBg(bgKitchen),meterLabel:'ORMEKUR'};
  const near=()=>cat&&leave<=0&&Math.abs(cat.x-p.x)<p.reach+12&&cat.y>=126;
  function resolve(){
    const r=pending;pending=null;if(!r||!cat)return;
    if(!r.pill){sus=Math.max(0,sus-25);ftext(cat.x,cat.y-20,'nam','#e9d9b8',5);return;}
    if(r.spit){ftext(cat.x,cat.y-22,'PTUI!','#ff6a55',7);burst(cat.x+cat.dir*8,cat.y-8,['#f4f6f8'],4,60);p.say(pick(['Hvordan OPDAGEDE du den?!','Den var jo gemt!','Argh!']),1.6);}
    else{addProg(100/order.length);ftext(cat.x,cat.y-22,'*sluk*',COPPER,7);p.say('JA! Ormekur!',1.4);leave=2.5;}
  }
  function give(pill){
    if(cd>0||p.busy>0||eat>0)return;
    if(!near()){hint(p,'Katten er for langt væk');return;}
    if(pill&&pills<=0){hint(p,'Ingen piller tilbage');return;}
    if(!pill&&snacks<=0){hint(p,'Ingen snacks tilbage');return;}
    if(pill){pills--;const ch=Math.max(.08,Math.min(.92,sus/100+.12));pending={pill:true,spit:Math.random()<ch};sus=Math.min(100,sus+35/p.calm);}
    else{snacks--;pending={pill:false};}
    cd=p.reach>12?.45:.7;p.busy=.3;p.pose='clean';p.dir=cat.x>=p.x?1:-1;eat=.8;SFX.paw();
  }
  lv.update=(dt,inp)=>{
    cd=Math.max(0,cd-dt);
    if(eat>0){eat-=dt;if(eat<=0)resolve();}
    steer(p,dt,inp);poseFor(p,false);
    if(leave>0){leave-=dt;wander(cat,dt,[],{target:330,maxX:330});if(leave<=0){ci++;cat=ci<order.length?new Cat(order[ci],16):null;sus=35;}}
    else if(cat){if(eat>0){cat.update(dt,[],{});cat.pose='knead';}else wander(cat,dt,plats,{jumpy:.15,speed:.8});}
    if(inp.jump)give(true);
    if(pills<=0&&!pending&&cat&&leave<=0&&game.time>1&&!game.ending)game.time=1;
  };
  lv.action=()=>give(false);
  lv.drawBack=g=>{drawHuman(g,p);if(cat)dc(g,cat);};
  lv.drawFront=()=>{};
  lv.hud=g=>{bar(g,'MISTANKE',6,165,sus/100,'#ff6a55');txt(g,`Piller: ${pills} · Snacks: ${snacks}`,6,174,{size:5,align:'left'});};
  return lv;
}

const menu={bg:null,plats:[{x:16,y:140,w:76},{x:220,y:138,w:30},{x:228,y:108,w:50}],cats:[]};
function menuInit(){
  menu.bg=makeBg(bgLiving);menu.cats=[new Cat('fluffy',130),new Cat('nova',186)];menu.cats[1].dir=-1;

function menuUpdate(dt){
  for(const c of menu.cats){
    const a=c.ai;a.t-=dt;
    if(a.t<=0){
      const r=Math.random();a.l=a.r=false;
      if(r<.33){a.l=true;a.t=.4+Math.random();}else if(r<.66){a.r=true;a.t=.4+Math.random();}
      else{a.t=.8+Math.random()*1.6;if(Math.random()<.35)ftext(c.x+c.dir*8,c.y-20,'mjav',CREAM,5);}
      a.j=Math.random()<.3;
    }
    c.update(dt,menu.plats,{left:a.l,right:a.r,jump:a.j,down:false});a.j=false;
  }
}

/* ---------- input ---------- */
const keys={left:false,right:false,down:false,up:false};
const queued={jump:false,action:false};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down'};
const overlay=document.getElementById('overlay');
addEventListener('keydown',e=>{
  if(game.mode!=='play'){
    if(e.code==='Escape'&&game.mode==='pause'){resume();e.preventDefault();return;}
    if(e.code==='Enter'||e.code==='Space'){
      const ae=document.activeElement;
      if(ae&&ae.tagName==='BUTTON'&&overlay.contains(ae))return;
      const p=overlay.querySelector('[data-primary]');if(p){e.preventDefault();p.click();}
    }
    return;
  }
  if(KEYMAP[e.code]){keys[KEYMAP[e.code]]=true;e.preventDefault();}
  if(['Space','ArrowUp','KeyW'].includes(e.code)){if(!e.repeat)queued.jump=true;keys.up=true;e.preventDefault();}
  if(['KeyX','KeyE','KeyJ','KeyK'].includes(e.code)){if(!e.repeat)queued.action=true;e.preventDefault();}
  if(e.code==='KeyP'||e.code==='Escape'){pause();e.preventDefault();}
});
addEventListener('keyup',e=>{if(KEYMAP[e.code])keys[KEYMAP[e.code]]=false;if(['Space','ArrowUp','KeyW'].includes(e.code))keys.up=false;});
addEventListener('blur',()=>{keys.left=keys.right=keys.down=keys.up=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
document.querySelectorAll('[data-pad]').forEach(b=>{
  const k=b.dataset.pad;
  const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('on');audio();
    if(k==='jump'){queued.jump=true;keys.up=true;}else if(k==='action')queued.action=true;else keys[k]=true;};
  const off=()=>{b.classList.remove('on');if(k in keys)keys[k]=false;if(k==='jump')keys.up=false;};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const touchy=matchMedia('(pointer: coarse)').matches;
if(touchy)document.body.classList.add('touch');
addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});

/* ---------- screens ---------- */
function show(html){overlay.innerHTML=html;overlay.hidden=false;const p=overlay.querySelector('[data-primary]');if(p&&!document.body.classList.contains('touch'))p.focus({preventScroll:true});}
function hide(){overlay.hidden=true;overlay.innerHTML='';}
overlay.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;audio();act(b.dataset.act,b.dataset.arg);});
function act(a,arg){
  if(a==='select')goSelect();
  else if(a==='pick'){save.cat=arg;game.catKind=arg;persist();SFX.meow(arg==='nova'?.85:1.15);goLevels();}
  else if(a==='levels')goLevels();
  else if(a==='brief')goBrief(+arg);
  else if(a==='start')startPlay();
  else if(a==='retry'){loadLevel(game.li);startPlay();}
  else if(a==='next')goBrief(game.li+1);
  else if(a==='resume')resume();
  else if(a==='title')goTitle();
  else if(a==='owner')goOwner(null);
  else if(a==='pickOwner'){save.owner=arg;game.ownerKind=arg;persist();if(pendingBrief!=null){const i=pendingBrief;pendingBrief=null;goBrief(i);}else goLevels();}
}

function setControls(d){
  const el=document.getElementById('keys');if(KEYS_DEFAULT===null)KEYS_DEFAULT=el.innerHTML;
  el.innerHTML=d&&d.keys?d.keys.replace(/(←|→|Mellemrum|X)/g,'<kbd>$1</kbd>')+' · <kbd>P</kbd> pause':KEYS_DEFAULT;
  document.querySelector('[data-pad=action]').textContent=d&&d.pad?d.pad.a:'BALLADE!';
  document.querySelector('[data-pad=jump]').textContent=d&&d.pad?d.pad.b:'HOP';
}
function padLabels(){setControls(LEVELS[game.li]);}
function startPlay(){musicWant(false);game.mode='play';hide();queued.jump=queued.action=false;padLabels();}
function pause(){if(game.mode!=='play')return;game.mode='pause';keys.left=keys.right=keys.down=keys.up=false;
  show(`<div class="screen"><h2>Pause</h2><p class="dim">Madslaverne venter. Det gør de altid.</p>
  <div class="row"><button class="btn" data-act="resume" data-primary>Fortsæt</button><button class="btn ghost" data-act="retry">Start forfra</button><button class="btn ghost" data-act="levels">Baner</button><button class="btn ghost" data-act="title">Hjem</button></div></div>`);}
function resume(){if(game.mode!=='pause')return;game.mode='play';hide();}
function finish(){
  const win=game.ending.win,d=LEVELS[game.li],id=game.li+1;
  const irr=Math.round(game.level.irritation?game.level.irritation():game.irr);
  const tl=Math.ceil(game.time),ts=`${Math.floor(tl/60)}:${String(tl%60).padStart(2,'0')}`;
  game.mode='result';
  if(win){
    const r=game.time/d.time,st=r>=.45?3:r>=.2?2:1;
    save.stars[id]=Math.max(save.stars[id]||0,st);save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length,id+1));persist();
    const last=game.li===LEVELS.length-1,ch1end=game.li===7;
    show(`<div class="screen"><p class="eyebrow">Bane ${id} · ${d.name}</p><h2>Mission klaret!</h2><div class="stars" aria-label="${st} af 3 stjerner">${starStr(st)}</div>
      <p class="dim">Tid tilbage: ${ts}. Tre stjerner kræver mindst ${Math.ceil(d.time*.45)} sekunder tilbage.</p>
      ${ch1end?'<p class="lede">Kattene fik snacks, og madslaverne sov videre på sofaen. Nyt kapitel er låst op: Madslavernes tur!</p>':''}${last?'<p class="lede">Kattene er rene, mætte, ormefri og spinder. Madslaverne har fortjent en lur. Tak fordi du spillede. Til Mr Fluffy &amp; Nova.</p>':''}
      <div class="row">${last?'<button class="btn" data-act="levels" data-primary>Baner</button>':('<button class="btn" data-act="next" data-primary>'+(ch1end?'Næste kapitel':'Næste bane')+'</button>')}
      <button class="btn ghost" data-act="retry">Prøv igen</button>${last?'':'<button class="btn ghost" data-act="levels">Baner</button>'}</div></div>`);
  }else{
    show(`<div class="screen"><p class="eyebrow">Bane ${id} · ${d.name}</p><h2>Tiden løb ud</h2>
      <p class="lede">Du nåede ${irr} % ${d.chapter===2?'af opgaven':'irritation'}. ${d.lose||'Madslaverne slap for denne gang.'}</p>
      <div class="row"><button class="btn" data-act="retry" data-primary>Prøv igen</button><button class="btn ghost" data-act="levels">Baner</button></div></div>`);
  }
}

/* ---------- loop ---------- */
function meow(cat){
  if(cat.cool>0)return;cat.cool=.5;cat.busy=.2;cat.busyPose='meow';SFX.meow(cat.kind==='nova'?.85:1.15);
  ftext(cat.x+cat.dir*8,cat.y-20,'Mjav!');if(game.level.onMeow)game.level.onMeow(cat);
}
function carryUpdate(dt){
  const cat=game.cat;
  for(const o of game.level.owners){
    if(!o.carry)continue;const done=o.walkTo(o.carry.x,44,dt);o.pose='carry';
    cat.x=o.x+o.dir*8;cat.y=o.y-18-(o.look.tall||0);cat.dir=o.dir;
    if(done){cat.carried=null;cat.y=FLOOR;cat.vy=0;cat.onGround=true;cat.ground=null;cat.stun=.5;cat.kvx=0;const f=o.carry.done;o.carry=null;o.pose='stand';o.moving=false;if(f)f();}
  }
}
function update(dt){
  game.t+=dt;game.shake=Math.max(0,game.shake-dt*12);
  if(game.mode==='play'){
    const lv=game.level,cat=game.cat;
    lv.owners.forEach(o=>o.t+=dt);
    if(lv.owner){
      const inp=game.ending?{}:{left:keys.left,right:keys.right,down:keys.down,jump:queued.jump,up:keys.up};
      lv.update(dt,inp);
      if(!game.ending&&queued.action)lv.action(inp);
    }else{
      const inp=game.ending?{}:{left:keys.left,right:keys.right,down:keys.down,jump:queued.jump,sfx:true};
      cat.update(dt,lv.plats,inp);
      if(!game.ending&&queued.action&&!cat.carried&&cat.stun<=0&&cat.busy<=0){if(!lv.action(cat))meow(cat);}
      lv.update(dt,cat);carryUpdate(dt);
    }
    for(const s of lv.speakers)if(s.bubble){s.bubble.t-=dt;if(s.bubble.t<=0)s.bubble=null;}
    game.introT+=dt;
    if(!game.ending){
      game.time-=dt;const irr=lv.irritation?lv.irritation():game.irr;
      if(game.time<=5&&game.time>0){const s=Math.ceil(game.time);if(s!==game.lastTick){game.lastTick=s;SFX.tick();}}
      if(irr>=100){game.ending={win:true,t:2.2};lv.onWin&&lv.onWin();SFX.win();burst(cat.x,cat.y-10,[COPPER,CREAM,'#ffd34a'],18,80);}
      else if(game.time<=0){game.time=0;game.ending={win:false,t:1.8};SFX.lose();}
    }else{game.ending.t-=dt;if(game.ending.t<=0)finish();}
  }else if(game.mode==='title'||game.mode==='select'||game.mode==='levels')menuUpdate(dt);
  for(const t of game.texts){t.t-=dt;t.y-=12*dt;}game.texts=game.texts.filter(t=>t.t>0);
  for(const p of game.fx){p.t-=dt;p.vy+=300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}game.fx=game.fx.filter(p=>p.t>0);
  queued.jump=queued.action=false;
}
function drawHUD(g){
  const d=LEVELS[game.li],lv=game.level;
  g.fillStyle='rgba(20,18,32,.82)';g.fillRect(0,0,W,15);
  txt(g,`${game.li+1}. ${d.name}`,5,8,{size:7,align:'left',outline:null});
  const irr=lv.irritation?lv.irritation():game.irr,mx=124,mw=84;
  R(g,mx-1,3,mw+2,9,OL);R(g,mx,4,mw,7,'#3b3858');R(g,mx,4,Math.round(mw*irr/100),7,irr>=100?'#7fd48a':COPPER);R(g,mx,4,Math.round(mw*irr/100),1,'#f6c47c');
  txt(g,lv.meterLabel||'IRRITATION',mx+mw/2,8,{size:5,outline:OL});
  const tl=Math.ceil(game.time),ts=`${Math.floor(tl/60)}:${String(tl%60).padStart(2,'0')}`;
  const red=game.time<=10&&!game.ending;
  txt(g,ts,W-5,8,{size:8,align:'right',outline:null,col:red&&Math.floor(game.t*4)%2?'#ff6a55':CREAM});
  if(lv.hud)lv.hud(g);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  const sx=game.shake?Math.round((Math.random()*2-1)*game.shake):0,sy=game.shake?Math.round((Math.random()*2-1)*game.shake):0;
  ctx.setTransform(S,0,0,S,sx*S,sy*S);
  const inLevel=game.level&&['brief','play','pause','result'].includes(game.mode);
  if(inLevel){
    const lv=game.level,cat=game.cat;
    ctx.drawImage(lv.bg,0,0,W,H);
    lv.drawBack(ctx);if(!lv.owner)drawCat(ctx,cat.kind,cat.x,cat.y,cat.dir,cat.pose,cat.t);lv.drawFront(ctx);
    if(lv.tint){ctx.fillStyle=lv.tint;ctx.fillRect(-4,-4,W+8,H+8);}
  }else{
    if(!menu.bg)menuInit();
    ctx.drawImage(menu.bg,0,0,W,H);for(const c of menu.cats)drawCat(ctx,c.kind,c.x,c.y,c.dir,c.pose,c.t);
  }
  for(const p of game.fx)R(ctx,p.x,p.y,2,2,p.c);
  for(const t of game.texts)txt(ctx,t.s,t.x,t.y,{size:t.size,col:t.col,alpha:Math.min(1,t.t*2)});
  if(inLevel){
    for(const s of game.level.speakers)if(s.bubble)bubble(ctx,bubbleX(s),bubbleY(s),s.bubble.text);
    ctx.setTransform(S,0,0,S,0,0);
    if(game.mode==='play'||game.mode==='pause'){
      drawHUD(ctx);
      if(game.mode==='play'&&game.introT<4&&!game.ending)txt(ctx,LEVELS[game.li].hint,W/2,32,{size:9,col:COPPER,alpha:Math.min(1,(4-game.introT)*1.5)});
      if(game.ending)txt(ctx,game.ending.win?'MISSION KLARET!':'TIDEN ER GÅET!',W/2,70,{size:16,col:game.ending.win?COPPER:'#ff6a55'});
    }
  }
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
goTitle();
requestAnimationFrame(frame);
})();
</script>
